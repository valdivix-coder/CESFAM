name: Regenerar la base desde la planilla

# Subir un Excel nuevo por la web de GitHub es todo lo que hace falta para
# actualizar la aplicación: este flujo reconstruye data/sectores.json y lo
# commitea, y ese commit dispara los despliegues.
on:
  push:
    branches: [main]
    paths: ['**.xlsx']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-sectores
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerar data/sectores.json
        run: npm run convert:sectors

      - name: Verificar que la aplicación sigue funcionando
        run: npm test

      - name: Commit si la base cambió
        run: |
          if git diff --quiet -- data/sectores.json; then
            echo "La base no cambió; no hay nada que publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sectores.json
          git commit -m "Regenerar la base de sectores desde la planilla"
          git push
