<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0d10">
    <title>CESFAM · Sectores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow"><span></span> CESFAM</p>
        <h1>Sectoriza<br>una calle.</h1>
      </header>

      <section class="search-panel" aria-labelledby="search-title">
        <h2 id="search-title">Consulta</h2>
        <form id="street-form" novalidate>
          <div class="search-row">
            <label class="sr-only" for="street-input">Nombre de calle</label>
            <input id="street-input" name="street" type="search" autocomplete="off" placeholder="Ej. Los Coigües" required>
            <label class="sr-only" for="number-input">Número de la casa</label>
            <input id="number-input" name="number" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="Nº" aria-describedby="search-help">
            <button type="submit">Buscar <span aria-hidden="true">↗</span></button>
          </div>
        </form>
        <p class="help" id="search-help">Sin tildes también funciona. Agrega el número cuando la calle se divide entre sectores.</p>
      </section>

      <section aria-live="polite" aria-atomic="true">
        <div id="result" class="result empty">Ingresa una calle.</div>
      </section>

      <section class="summary" aria-label="Sectores disponibles">
        <div id="sector-summary" class="sector-summary"></div>
      </section>
    </main>
    <script src="sector-lookup.js"></script>
    <script src="app.js"></script>
  </body>
</html>
