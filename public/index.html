<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f1f3f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Consulta a qué sector del CESFAM Pitrufquén pertenece tu calle.">
    <title>Consulta tu sector · CESFAM Pitrufquén</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='9' cy='16' r='4.4' fill='%23d9a22b'/><circle cx='16' cy='16' r='4.4' fill='%232c8ed6'/><circle cx='23' cy='16' r='4.4' fill='%231f9e70'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=Instrument+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <p class="eyebrow">
          <img class="crest" src="escudo-pitrufquen.png" width="181" height="192"
               alt="Escudo de la Municipalidad de Pitrufquén" decoding="async">
          <span>CESFAM Pitrufquén</span>
        </p>
        <h1>Consulta tu sector</h1>
        <p class="lede">Escribe el nombre de tu calle y te decimos a qué sector del centro de salud perteneces.</p>
      </header>

      <form class="finder" id="street-form" role="search" novalidate>
        <div class="field">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"/><path d="m15.8 15.8 4.2 4.2"/>
          </svg>
          <input
            id="street-input"
            name="street"
            type="text"
            autocomplete="off"
            autocapitalize="words"
            spellcheck="false"
            placeholder="Ej. Millahuin"
            role="combobox"
            aria-expanded="false"
            aria-controls="suggestions"
            aria-autocomplete="list"
            aria-label="Nombre de tu calle">
          <button class="field-clear" id="clear-button" type="button" aria-label="Borrar" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/>
            </svg>
          </button>
        </div>
        <ul class="suggestions" id="suggestions" role="listbox" aria-label="Calles sugeridas" hidden></ul>
      </form>

      <section class="answer" id="answer" aria-live="polite" aria-atomic="true"></section>

      <footer class="credits">
        <p class="credits-line">
          Desarrollado por <strong>Mg. Simón Valdivia</strong>
          <span class="credits-role">Psicólogo especializado en Desarrollo Creativo e Inteligencia Artificial</span>
        </p>

          <a href="https://wa.me/message/BTVOFGDVGI5UG1" target="_blank" rel="noopener noreferrer" aria-label="Escribir por WhatsApp a Simón Valdivia" title="Escribir por WhatsApp a Simón Valdivia">

          </a>

</html>
